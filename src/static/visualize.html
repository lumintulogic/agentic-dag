<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAG Mermaid Visualization</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1b2e;
            color: #e8e8f0;
        }
        body { margin: 0; min-height: 100vh; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: .75rem 1.5rem;
            background: #252641;
            border-bottom: 1px solid #3a3b5c;
        }
        h1 { margin: 0; font-size: 1.25rem; }
        .actions { display: flex; gap: .75rem; }
        button, a {
            border: 1px solid #3a3b5c;
            border-radius: 4px;
            background: #2d2f4e;
            color: #e8e8f0;
            padding: .5rem .9rem;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover, a:hover { background: #3a3b5c; }
        main { padding: 1.5rem; }
        #status { color: #a0a0b8; margin: 0 0 1rem; }
        #diagram {
            min-height: 70vh;
            height: 70vh;
            overflow: hidden;
            border: 1px solid #3a3b5c;
            border-radius: 6px;
            background: #252641;
        }
        #diagram svg.pan-zoom {
            display: block;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            cursor: grab;
            touch-action: none;
        }
        #diagram svg.pan-zoom.dragging { cursor: grabbing; }
        details { margin-top: 1rem; }
        pre {
            overflow: auto;
            padding: 1rem;
            border-radius: 6px;
            background: #252641;
            white-space: pre-wrap;
        }
        .error { color: #ff9f93; }
    </style>
</head>
<body>
    <header>
        <h1>DAG Mermaid Visualization</h1>
        <div class="actions">
            <a id="control-panel">Control Panel</a>
            <a id="graph-canvas">Graph Canvas</a>
            <a id="raw-mermaid" target="_blank" rel="noopener">Raw Mermaid</a>
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="reset-view" type="button">Reset View</button>
            <button id="refresh" type="button">Refresh</button>
        </div>
    </header>
    <main>
        <p id="status" role="status">Loading diagram…</p>
        <div id="diagram" aria-live="polite"></div>
        <details>
            <summary>Generated Mermaid source</summary>
            <pre id="source"></pre>
        </details>
    </main>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'strict',
            flowchart: { useMaxWidth: false }
        });

        const status = document.getElementById('status');
        const diagram = document.getElementById('diagram');
        const source = document.getElementById('source');
        const rawMermaid = document.getElementById('raw-mermaid');
        const controlPanel = document.getElementById('control-panel');
        const graphCanvas = document.getElementById('graph-canvas');
        let renderVersion = 0;
        let panZoom = null;

        function appBasePath() {
            return window.location.pathname
                .replace(/\/visualize(?:\.html)?\/?$/, '/');
        }

        function apiPath(endpoint) {
            return `${appBasePath()}api/${endpoint}`;
        }

        controlPanel.href = appBasePath();
        graphCanvas.href = `${appBasePath()}graph`;

        function parseViewBox(svg) {
            const values = (svg.getAttribute('viewBox') || '').trim().split(/[ ,]+/).map(Number);
            if (values.length === 4 && values.every(Number.isFinite)) return values;
            const box = svg.getBBox();
            return [box.x, box.y, box.width || 1, box.height || 1];
        }

        function setViewBox() {
            const { svg, viewBox } = panZoom;
            svg.setAttribute('viewBox', viewBox.join(' '));
        }

        function zoomAt(factor, clientX, clientY) {
            const { svg, viewBox, initial } = panZoom;
            const rect = svg.getBoundingClientRect();
            const pointX = clientX === undefined ? rect.left + rect.width / 2 : clientX;
            const pointY = clientY === undefined ? rect.top + rect.height / 2 : clientY;
            const x = viewBox[0] + (pointX - rect.left) / rect.width * viewBox[2];
            const y = viewBox[1] + (pointY - rect.top) / rect.height * viewBox[3];
            const minimumWidth = initial[2] / 30;
            const maximumWidth = initial[2] * 10;
            const nextWidth = Math.max(minimumWidth, Math.min(maximumWidth, viewBox[2] * factor));
            const actualFactor = nextWidth / viewBox[2];
            const nextHeight = viewBox[3] * actualFactor;
            viewBox[0] = x - (x - viewBox[0]) * actualFactor;
            viewBox[1] = y - (y - viewBox[1]) * actualFactor;
            viewBox[2] = nextWidth;
            viewBox[3] = nextHeight;
            setViewBox();
        }

        function initializePanZoom(svg) {
            const initial = parseViewBox(svg);
            panZoom = { svg, initial, viewBox: [...initial] };
            svg.classList.add('pan-zoom');
            svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            setViewBox();

            let lastPoint = null;
            svg.addEventListener('wheel', event => {
                event.preventDefault();
                zoomAt(event.deltaY < 0 ? .8 : 1.25, event.clientX, event.clientY);
            }, { passive: false });
            svg.addEventListener('pointerdown', event => {
                if (event.button !== 0) return;
                lastPoint = { x: event.clientX, y: event.clientY };
                svg.setPointerCapture(event.pointerId);
                svg.classList.add('dragging');
            });
            svg.addEventListener('pointermove', event => {
                if (!lastPoint) return;
                const rect = svg.getBoundingClientRect();
                panZoom.viewBox[0] -= (event.clientX - lastPoint.x) / rect.width * panZoom.viewBox[2];
                panZoom.viewBox[1] -= (event.clientY - lastPoint.y) / rect.height * panZoom.viewBox[3];
                lastPoint = { x: event.clientX, y: event.clientY };
                setViewBox();
            });
            const endPan = () => {
                lastPoint = null;
                svg.classList.remove('dragging');
            };
            svg.addEventListener('pointerup', endPan);
            svg.addEventListener('pointercancel', endPan);
        }

        function resetView() {
            if (!panZoom) return;
            panZoom.viewBox = [...panZoom.initial];
            setViewBox();
        }

        async function renderDiagram() {
            status.classList.remove('error');
            status.textContent = 'Loading diagram…';
            diagram.replaceChildren();
            try {
                const response = await fetch(apiPath('dag/mermaid'), { cache: 'no-store' });
                if (!response.ok) throw new Error(`The server returned ${response.status}`);
                const mermaidSource = await response.text();
                source.textContent = mermaidSource;
                rawMermaid.href = apiPath('dag/mermaid');

                const { svg, bindFunctions } = await mermaid.render(
                    `dag-mermaid-diagram-${++renderVersion}`, mermaidSource
                );
                diagram.innerHTML = svg;
                bindFunctions?.(diagram);
                initializePanZoom(diagram.querySelector('svg'));
                status.textContent = 'Diagram rendered. Scroll to zoom and drag to pan.';
            } catch (error) {
                status.classList.add('error');
                status.textContent = `Could not render the diagram: ${error.message}`;
            }
        }

        document.getElementById('refresh').addEventListener('click', renderDiagram);
        document.getElementById('zoom-in').addEventListener('click', () => panZoom && zoomAt(.8));
        document.getElementById('zoom-out').addEventListener('click', () => panZoom && zoomAt(1.25));
        document.getElementById('reset-view').addEventListener('click', resetView);
        renderDiagram();
    </script>
</body>
</html>
