<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAG Project · Kanban</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --page: #111321;
            --surface: #1a1d30;
            --surface-raised: #242841;
            --surface-hover: #2d3250;
            --text: #f3f4fb;
            --muted: #a7acc4;
            --border: #343954;
            --line: #9fc5ff;
            background: var(--page);
            color: var(--text);
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: .75rem 1.25rem;
            background: rgba(26, 29, 48, .96);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .18);
            z-index: 10;
        }
        .heading { min-width: 0; }
        h1 { margin: 0; font-size: 1.18rem; letter-spacing: -.01em; }
        .subtitle { margin: .15rem 0 0; color: var(--muted); font-size: .8rem; }
        .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .55rem; }
        button, a {
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface-raised);
            color: var(--text);
            padding: .48rem .78rem;
            font: inherit;
            font-size: .86rem;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }
        button:hover, a:hover { background: var(--surface-hover); border-color: #50577a; }
        button[aria-pressed="false"] { color: var(--muted); }
        main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .board-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            min-height: 44px;
            padding: .5rem 1.25rem;
            border-bottom: 1px solid rgba(52, 57, 84, .65);
        }
        #status { margin: 0; color: var(--muted); font-size: .86rem; }
        #status.error { color: #ff9f93; }
        .legend { display: flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .78rem; }
        .legend-line { width: 28px; height: 8px; overflow: visible; }
        #board-scroll {
            flex: 1;
            min-height: 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 1.1rem;
            scrollbar-color: #4b5173 var(--surface);
        }
        #board {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            width: max-content;
            min-width: 100%;
            min-height: 100%;
        }
        #connections {
            position: absolute;
            inset: 0 auto auto 0;
            overflow: visible;
            pointer-events: none;
            z-index: 3;
        }
        .dependency-line {
            fill: none;
            stroke: var(--line);
            stroke-width: 1.75;
            stroke-opacity: .48;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7));
            transition: stroke-opacity .15s ease, stroke-width .15s ease;
        }
        .dependency-line.muted { stroke-opacity: .1; }
        .dependency-line.highlighted { stroke-opacity: 1; stroke-width: 3; }
        .lane {
            --lane-color: #8b7cf6;
            position: relative;
            z-index: auto;
            flex: 0 0 292px;
            width: 292px;
            height: calc(100vh - 150px);
            min-height: 0;
            padding: .85rem;
            border: 1px solid var(--border);
            border-top: 3px solid var(--lane-color);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(36, 40, 65, .95), rgba(26, 29, 48, .95));
            display: flex;
            flex-direction: column;
        }
        .lane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            margin-bottom: .85rem;
            padding: 0 .15rem;
            border: 0;
            box-shadow: none;
            background: transparent;
            min-height: 0;
        }
        .lane-title { margin: 0; min-width: 0; font-size: .9rem; font-weight: 700; overflow-wrap: anywhere; }
        .lane-count {
            flex: none;
            min-width: 1.65rem;
            padding: .15rem .45rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            color: var(--muted);
            text-align: center;
            font-size: .72rem;
        }
        .offscreen-dock {
            position: relative;
            z-index: 5;
            display: flex;
            flex: 0 0 auto;
            min-width: 0;
            width: 100%;
            align-items: flex-start;
            gap: .35rem;
            min-height: 34px;
            max-height: 92px;
            padding: .25rem .35rem;
            overflow: hidden;
            border: 1px dashed #444b6d;
            border-radius: 6px;
            background: rgba(17, 19, 33, .82);
        }
        .offscreen-dock.top { margin-bottom: .55rem; }
        .offscreen-dock.bottom { margin-top: .55rem; }
        .dock-direction {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
            color: var(--muted);
            font-size: .72rem;
            line-height: 1;
        }
        .dock-items {
            display: flex;
            flex-wrap: wrap;
            min-width: 0;
            flex: 1;
            gap: .3rem;
            max-height: 84px;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #555d84 transparent;
        }
        .dock-items::-webkit-scrollbar {
            width: 4px;
        }
        .dock-items::-webkit-scrollbar-thumb {
            background: #555d84;
            border-radius: 2px;
        }
        .offscreen-card {
            flex: 0 0 auto;
            max-width: 100%;
            height: 24px;
            padding: .18rem .45rem;
            overflow: hidden;
            border-color: color-mix(in srgb, var(--lane-color) 60%, #4a5275);
            border-radius: 5px;
            background: #252a43;
            color: #dfe2f4;
            font-size: .68rem;
            line-height: 1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .offscreen-card:hover, .offscreen-card:focus-visible {
            outline: none;
            border-color: var(--lane-color);
            background: #323957;
        }
        .lane-cards {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            gap: .75rem;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 0 .25rem .25rem 0;
            scrollbar-color: #555d84 transparent;
        }
        .card {
            position: relative;
            z-index: 4;
            min-height: 92px;
            max-width: 100%;
            overflow: hidden;
            padding: .85rem;
            border: 1px solid #3d4362;
            border-left: 3px solid var(--lane-color);
            border-radius: 8px;
            background: #20243a;
            box-shadow: 0 5px 14px rgba(0, 0, 0, .2);
            transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
        }
        .card:hover, .card:focus-visible {
            outline: none;
            transform: translateY(-2px);
            border-color: var(--lane-color);
            box-shadow: 0 9px 20px rgba(0, 0, 0, .3);
        }
        .card-id {
            margin: 0 0 .4rem;
            overflow: hidden;
            color: var(--muted);
            font: 600 .7rem ui-monospace, SFMono-Regular, Menlo, monospace;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-title {
            display: -webkit-box;
            max-height: 2.7em;
            margin: 0;
            overflow: hidden;
            font-size: .9rem;
            line-height: 1.35;
            overflow-wrap: anywhere;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
        }
        .card-dependencies {
            margin: .7rem 0 0;
            overflow: hidden;
            color: var(--muted);
            font-size: .72rem;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-dependencies strong { color: #d7daf0; }
        .empty { width: 100%; margin: auto; color: var(--muted); text-align: center; }
        dialog {
            width: min(660px, calc(100vw - 2rem));
            max-height: min(82vh, 760px);
            padding: 0;
            overflow: hidden;
            border: 1px solid #4a5275;
            border-radius: 12px;
            background: #1d2136;
            color: var(--text);
            box-shadow: 0 24px 70px rgba(0, 0, 0, .58);
        }
        dialog::backdrop { background: rgba(5, 7, 16, .76); backdrop-filter: blur(3px); }
        .modal-panel { display: flex; max-height: min(82vh, 760px); flex-direction: column; }
        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.1rem 1.2rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-lane { margin: 0 0 .3rem; color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; }
        .modal-title { margin: 0; font-size: 1.15rem; line-height: 1.35; overflow-wrap: anywhere; }
        .modal-close { flex: none; padding: .25rem .55rem; font-size: 1.2rem; line-height: 1; }
        .modal-body { padding: 1.15rem 1.2rem 1.25rem; overflow: auto; }
        .modal-details { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .65rem 1rem; margin: 0; }
        .modal-details dt { color: var(--muted); font-size: .78rem; font-weight: 700; }
        .modal-details dd { margin: 0; overflow-wrap: anywhere; font-size: .86rem; white-space: pre-wrap; }
        .modal-description { margin-top: 1.1rem; }
        .modal-description h3 { margin: 0 0 .45rem; font-size: .82rem; }
        .modal-description p { margin: 0; color: #d9dcef; font-size: .86rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
        .raw-details { margin-top: 1.1rem; }
        .raw-details summary { color: var(--muted); cursor: pointer; font-size: .8rem; font-weight: 700; }
        .raw-details pre {
            max-height: 18rem;
            margin: .65rem 0 0;
            padding: .8rem;
            overflow: auto;
            border-radius: 7px;
            background: #121525;
            color: #d9dcef;
            font: .75rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        @media (max-width: 720px) {
            body { overflow: auto; }
            header { align-items: flex-start; flex-direction: column; }
            .actions { justify-content: flex-start; }
            main { min-height: 72vh; }
            .legend { display: none; }
            .lane { flex-basis: 265px; width: 265px; height: 65vh; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <div class="heading">
            <h1 id="project-title">DAG Project</h1>
            <p class="subtitle">Kanban · Cards grouped into lanes by label</p>
        </div>
        <div class="actions">
            <a id="control-panel">Control Panel</a>
            <a id="graph-canvas">Graph Canvas</a>
            <button id="toggle-connections" type="button" aria-pressed="true">Hide Dependencies</button>
            <button id="refresh" type="button">Refresh</button>
        </div>
    </header>
    <main>
        <div class="board-meta">
            <p id="status" role="status">Loading board…</p>
            <div class="legend" aria-hidden="true">
                <svg class="legend-line" viewBox="0 0 28 8"><path d="M0,4 C10,4 18,4 25,4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24,1 L28,4 L24,7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                dependency → dependent card
            </div>
        </div>
        <div id="board-scroll">
            <div id="board" aria-live="polite">
                <svg id="connections" aria-label="Card dependency connections">
                    <defs>
                        <marker id="dependency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fc5ff"></path>
                        </marker>
                    </defs>
                    <g id="connection-lines"></g>
                </svg>
                <div class="empty">Loading cards…</div>
            </div>
        </div>
    </main>

    <dialog id="card-modal" aria-labelledby="modal-title">
        <div class="modal-panel">
            <div class="modal-header">
                <div>
                    <p id="modal-lane" class="modal-lane"></p>
                    <h2 id="modal-title" class="modal-title"></h2>
                </div>
                <button id="modal-close" class="modal-close" type="button" aria-label="Close card details">×</button>
            </div>
            <div class="modal-body">
                <dl class="modal-details">
                    <dt>Card ID</dt><dd id="modal-id"></dd>
                    <dt>Label</dt><dd id="modal-label"></dd>
                    <dt>Dependencies</dt><dd id="modal-dependencies"></dd>
                </dl>
                <section id="modal-description-section" class="modal-description" hidden>
                    <h3>Description</h3>
                    <p id="modal-description"></p>
                </section>
                <details class="raw-details">
                    <summary>All card data</summary>
                    <pre id="modal-json"></pre>
                </details>
            </div>
        </div>
    </dialog>

    <script>
        const KNOWN_LANES = ['Backlog', 'To Do', 'Next', 'In Progress', 'Review', 'To Review', 'Done', 'Archived'];
        const LANE_COLORS = {
            Backlog: '#b2bec3', 'To Do': '#fdcb6e', Next: '#fdcb6e',
            'In Progress': '#4aa3ff', Review: '#a994ff', 'To Review': '#a994ff',
            Done: '#28c9a1', Archived: '#778093', Unlabelled: '#74b9ff'
        };
        const board = document.getElementById('board');
        const connections = document.getElementById('connections');
        const connectionLines = document.getElementById('connection-lines');
        const status = document.getElementById('status');
        const cardModal = document.getElementById('card-modal');
        const cardElements = new Map();
        const cardDataById = new Map();
        const cardPresentations = new Map();
        const dockElements = new Map();
        let cards = [];
        let connectionCount = 0;
        let totalConnectionCount = 0;
        let connectionsVisible = true;
        let drawFrame = null;

        function appBasePath() {
            return window.location.pathname.replace(/\/visualize(?:\.html)?\/?$/, '/');
        }

        function apiPath(endpoint) {
            return `${appBasePath()}api/${endpoint}`;
        }

        document.getElementById('control-panel').href = appBasePath();
        document.getElementById('graph-canvas').href = `${appBasePath()}graph`;

        function textValue(value) {
            if (typeof value === 'string' || typeof value === 'number') return String(value).trim();
            if (value && typeof value === 'object') return textValue(value.title ?? value.name ?? value.label);
            return '';
        }

        function cardPresentation(card) {
            const rawLabel = textValue(card.label);
            const parts = rawLabel.split(/\s+—\s+/);
            const hasStatusPrefix = parts.length > 1 && KNOWN_LANES.includes(parts[0]);
            const lane = (hasStatusPrefix ? parts[0] : rawLabel) || 'Unlabelled';
            const metadataTitle = textValue(card.title ?? card.name ?? card.deck?.card?.title);
            const title = metadataTitle || (hasStatusPrefix ? parts.slice(1).join(' — ') : textValue(card.id));
            return { lane, title: title || 'Untitled card' };
        }

        function dependencyId(value) {
            if (typeof value === 'string' || typeof value === 'number') return String(value);
            if (value && typeof value === 'object') return textValue(value.id ?? value.cardId ?? value.nodeId);
            return '';
        }

        function dependenciesFor(card) {
            const values = Array.isArray(card.dependencies)
                ? card.dependencies
                : (card.dependencies == null ? [] : [card.dependencies]);
            return [...new Set(values.map(dependencyId).filter(Boolean))];
        }

        function laneColor(name) {
            if (LANE_COLORS[name]) return LANE_COLORS[name];
            let hash = 0;
            for (const character of name) hash = ((hash << 5) - hash + character.charCodeAt(0)) | 0;
            return `hsl(${Math.abs(hash) % 360} 62% 66%)`;
        }

        function createElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) element.className = className;
            if (text !== undefined) element.textContent = text;
            return element;
        }

        function showCardDetails(card, presentation) {
            const dependencyIds = dependenciesFor(card);
            const description = textValue(card.description ?? card.deck?.card?.description);
            document.getElementById('modal-lane').textContent = presentation.lane;
            document.getElementById('modal-title').textContent = presentation.title;
            document.getElementById('modal-id').textContent = textValue(card.id) || '—';
            document.getElementById('modal-label').textContent = textValue(card.label) || 'Unlabelled';
            document.getElementById('modal-dependencies').textContent = dependencyIds.length
                ? dependencyIds.join(', ')
                : 'None';
            document.getElementById('modal-description').textContent = description;
            document.getElementById('modal-description-section').hidden = !description;
            document.getElementById('modal-json').textContent = JSON.stringify(card, null, 2);
            cardModal.querySelector('.raw-details').open = false;
            cardModal.showModal();
        }

        function renderBoard(data) {
            const projectTitle = textValue(data.project_title) || 'DAG Project';
            document.getElementById('project-title').textContent = projectTitle;
            document.title = `${projectTitle} · Kanban`;
            cards = data.nodes || [];
            cardElements.clear();
            cardDataById.clear();
            cardPresentations.clear();
            const lanes = new Map();
            for (const card of cards) {
                const presentation = cardPresentation(card);
                const cardId = String(card.id);
                cardDataById.set(cardId, card);
                cardPresentations.set(cardId, presentation);
                if (!lanes.has(presentation.lane)) lanes.set(presentation.lane, []);
                lanes.get(presentation.lane).push({ card, presentation });
            }

            const laneEntries = [...lanes.entries()].sort(([left], [right]) => {
                const leftIndex = KNOWN_LANES.indexOf(left);
                const rightIndex = KNOWN_LANES.indexOf(right);
                if (leftIndex >= 0 || rightIndex >= 0) {
                    return (leftIndex < 0 ? Infinity : leftIndex) - (rightIndex < 0 ? Infinity : rightIndex);
                }
                return left.localeCompare(right);
            });

            const fragment = document.createDocumentFragment();
            for (const [laneName, laneCards] of laneEntries) {
                const lane = createElement('section', 'lane');
                lane.style.setProperty('--lane-color', laneColor(laneName));
                lane.dataset.lane = laneName;
                const header = createElement('header', 'lane-header');
                header.append(createElement('h2', 'lane-title', laneName));
                header.append(createElement('span', 'lane-count', String(laneCards.length)));
                const topDock = createElement('div', 'offscreen-dock top');
                topDock.setAttribute('aria-label', `Cards above the visible ${laneName} lane area`);
                const topDockItems = createElement('div', 'dock-items');
                topDockItems.addEventListener('scroll', scheduleConnections, { passive: true });
                topDock.append(
                    createElement('span', 'dock-direction', '↑'),
                    topDockItems
                );
                const cardList = createElement('div', 'lane-cards');
                cardList.addEventListener('scroll', scheduleConnections, { passive: true });
                for (const { card, presentation } of laneCards) {
                    const cardId = String(card.id);
                    const dependencyIds = dependenciesFor(card);
                    const article = createElement('article', 'card');
                    article.tabIndex = 0;
                    article.dataset.cardId = cardId;
                    article.setAttribute('aria-label', `${presentation.title}. Card ${cardId}`);
                    article.setAttribute('aria-haspopup', 'dialog');
                    article.append(createElement('p', 'card-id', cardId));
                    article.append(createElement('h3', 'card-title', presentation.title));
                    const dependencyText = dependencyIds.length ? dependencyIds.join(', ') : 'None';
                    const dependencyRow = createElement('p', 'card-dependencies');
                    dependencyRow.append(createElement('strong', '', 'Depends on: '), document.createTextNode(dependencyText));
                    article.append(dependencyRow);
                    article.addEventListener('mouseenter', () => highlightConnections(cardId));
                    article.addEventListener('mouseleave', clearConnectionHighlight);
                    article.addEventListener('focus', () => highlightConnections(cardId));
                    article.addEventListener('blur', clearConnectionHighlight);
                    article.addEventListener('click', () => showCardDetails(card, presentation));
                    article.addEventListener('keydown', event => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            showCardDetails(card, presentation);
                        }
                    });
                    cardList.append(article);
                    cardElements.set(cardId, article);
                }
                const bottomDock = createElement('div', 'offscreen-dock bottom');
                bottomDock.setAttribute('aria-label', `Cards below the visible ${laneName} lane area`);
                const bottomDockItems = createElement('div', 'dock-items');
                bottomDockItems.addEventListener('scroll', scheduleConnections, { passive: true });
                bottomDock.append(
                    createElement('span', 'dock-direction', '↓'),
                    bottomDockItems
                );
                lane.append(header, topDock, cardList, bottomDock);
                fragment.append(lane);
            }

            board.querySelectorAll('.lane, .empty').forEach(element => element.remove());
            board.append(fragment);
            if (!cards.length) board.append(createElement('div', 'empty', 'No cards to display.'));
            scheduleConnections();
        }

        function elementGeometry(element, boardRect) {
            const rect = element.getBoundingClientRect();
            return {
                left: rect.left - boardRect.left,
                right: rect.right - boardRect.left,
                centerX: rect.left + rect.width / 2 - boardRect.left,
                centerY: rect.top + rect.height / 2 - boardRect.top,
                lane: element.closest('.lane')
            };
        }

        function cardViewportState(element, boardRect) {
            const rect = element.getBoundingClientRect();
            const viewport = element.closest('.lane-cards').getBoundingClientRect();
            const visibleTop = Math.max(rect.top, viewport.top);
            const visibleBottom = Math.min(rect.bottom, viewport.bottom);
            if (visibleBottom - visibleTop >= 8) {
                const geometry = elementGeometry(element, boardRect);
                geometry.centerY = (visibleTop + visibleBottom) / 2 - boardRect.top;
                return { geometry };
            }
            return {
                position: rect.bottom <= viewport.top ? 'top' : 'bottom',
                lane: element.closest('.lane')
            };
        }

        function proxyGeometry(proxy, boardRect) {
            const rect = proxy.getBoundingClientRect();
            const dockItems = proxy.closest('.dock-items');
            if (!dockItems) return elementGeometry(proxy, boardRect);

            const dockRect = dockItems.getBoundingClientRect();
            const visibleTop = Math.max(rect.top, dockRect.top);
            const visibleBottom = Math.min(rect.bottom, dockRect.bottom);
            const geometry = elementGeometry(proxy, boardRect);

            if (visibleBottom > visibleTop) {
                geometry.centerY = (visibleTop + visibleBottom) / 2 - boardRect.top;
            } else {
                const clampedY = rect.bottom <= dockRect.top ? dockRect.top + 4 : dockRect.bottom - 4;
                geometry.centerY = clampedY - boardRect.top;
            }
            return geometry;
        }

        function clearOffscreenDocks() {
            board.querySelectorAll('.dock-items').forEach(items => items.replaceChildren());
            dockElements.clear();
        }

        function syncOffscreenDocks(parkingMap) {
            for (const [cardId, proxyInfo] of dockElements.entries()) {
                const targetPosition = parkingMap.get(cardId);
                if (proxyInfo.position !== targetPosition) {
                    proxyInfo.proxy.remove();
                    dockElements.delete(cardId);
                }
            }

            const activeProxies = new Map();
            for (const [cardId, position] of parkingMap.entries()) {
                if (dockElements.has(cardId)) {
                    activeProxies.set(cardId, dockElements.get(cardId).proxy);
                } else {
                    const cardElement = cardElements.get(cardId);
                    const card = cardDataById.get(cardId);
                    const presentation = cardPresentations.get(cardId);
                    if (!cardElement || !card || !presentation) continue;
                    const lane = cardElement.closest('.lane');
                    const dock = lane.querySelector(`.offscreen-dock.${position} .dock-items`);
                    if (!dock) continue;

                    const proxy = createElement('button', 'offscreen-card', presentation.title);
                    proxy.type = 'button';
                    proxy.dataset.cardId = cardId;
                    proxy.title = `${presentation.title} (${cardId})`;
                    proxy.setAttribute('aria-label', `${presentation.title}, card ${position === 'top' ? 'above' : 'below'} the visible lane`);
                    proxy.addEventListener('mouseenter', () => highlightConnections(cardId));
                    proxy.addEventListener('mouseleave', clearConnectionHighlight);
                    proxy.addEventListener('focus', () => highlightConnections(cardId));
                    proxy.addEventListener('blur', clearConnectionHighlight);
                    proxy.addEventListener('click', () => showCardDetails(card, presentation));
                    dock.append(proxy);
                    dockElements.set(cardId, { proxy, position });
                    activeProxies.set(cardId, proxy);
                }
            }
            return activeProxies;
        }

        function connectionPath(source, target) {
            const sameLane = source.lane === target.lane;

            if (sameLane) {
                const gutterX = Math.min(source.left, target.left) - 9;
                return `M ${source.left} ${source.centerY} C ${gutterX} ${source.centerY}, ${gutterX} ${target.centerY}, ${target.left} ${target.centerY}`;
            }

            const pointsRight = target.centerX >= source.centerX;
            const startX = pointsRight ? source.right : source.left;
            const endX = pointsRight ? target.left : target.right;
            const midpointX = (startX + endX) / 2;
            return `M ${startX} ${source.centerY} C ${midpointX} ${source.centerY}, ${midpointX} ${target.centerY}, ${endX} ${target.centerY}`;
        }

        function drawConnections() {
            drawFrame = null;
            connectionLines.replaceChildren();
            const width = board.scrollWidth;
            const height = board.scrollHeight;
            connections.setAttribute('width', width);
            connections.setAttribute('height', height);
            connections.setAttribute('viewBox', `0 0 ${width} ${height}`);
            connections.hidden = !connectionsVisible;
            const boardRect = board.getBoundingClientRect();
            connectionCount = 0;
            totalConnectionCount = 0;
            const relationships = [];
            const endpointStates = new Map();

            for (const card of cards) {
                const targetId = String(card.id);
                const target = cardElements.get(targetId);
                if (!target) continue;
                for (const sourceId of dependenciesFor(card)) {
                    const normalizedSourceId = String(sourceId);
                    const source = cardElements.get(normalizedSourceId);
                    if (!source || source === target) continue;
                    totalConnectionCount += 1;
                    relationships.push({ sourceId: normalizedSourceId, targetId });
                    if (!endpointStates.has(normalizedSourceId)) {
                        endpointStates.set(normalizedSourceId, cardViewportState(source, boardRect));
                    }
                    if (!endpointStates.has(targetId)) {
                        endpointStates.set(targetId, cardViewportState(target, boardRect));
                    }
                }
            }

            const parkingMap = new Map();
            for (const { sourceId, targetId } of relationships) {
                const sourceVisible = Boolean(endpointStates.get(sourceId)?.geometry);
                const targetVisible = Boolean(endpointStates.get(targetId)?.geometry);
                if (sourceVisible !== targetVisible) {
                    const cardId = sourceVisible ? targetId : sourceId;
                    const state = endpointStates.get(cardId);
                    if (state?.position) {
                        parkingMap.set(cardId, state.position);
                    }
                }
            }
            const activeProxies = syncOffscreenDocks(parkingMap);
            for (const [cardId, proxy] of activeProxies.entries()) {
                const state = endpointStates.get(cardId);
                if (state) {
                    state.proxy = proxy;
                    state.geometry = proxyGeometry(proxy, boardRect);
                }
            }

            for (const { sourceId, targetId } of relationships) {
                const sourceState = endpointStates.get(sourceId);
                const targetState = endpointStates.get(targetId);
                const sourceVisible = Boolean(sourceState?.geometry) && !sourceState.proxy;
                const targetVisible = Boolean(targetState?.geometry) && !targetState.proxy;
                if (!sourceVisible && !targetVisible) continue;
                const sourceGeometry = sourceState?.geometry;
                const targetGeometry = targetState?.geometry;
                if (!sourceGeometry || !targetGeometry) continue;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('class', 'dependency-line');
                path.setAttribute('d', connectionPath(sourceGeometry, targetGeometry));
                path.setAttribute('marker-end', 'url(#dependency-arrow)');
                path.dataset.source = sourceId;
                path.dataset.target = targetId;
                connectionLines.append(path);
                connectionCount += 1;
            }
            updateStatus();
        }

        function scheduleConnections() {
            if (drawFrame !== null) cancelAnimationFrame(drawFrame);
            drawFrame = requestAnimationFrame(drawConnections);
        }

        function highlightConnections(cardId) {
            connectionLines.querySelectorAll('.dependency-line').forEach(line => {
                const connected = line.dataset.source === cardId || line.dataset.target === cardId;
                line.classList.toggle('highlighted', connected);
                line.classList.toggle('muted', !connected);
            });
        }

        function clearConnectionHighlight() {
            connectionLines.querySelectorAll('.dependency-line').forEach(line => line.classList.remove('highlighted', 'muted'));
        }

        function updateStatus() {
            const laneCount = board.querySelectorAll('.lane').length;
            const missing = cards.reduce((total, card) => total + dependenciesFor(card)
                .filter(id => !cardElements.has(String(id))).length, 0);
            const missingText = missing ? ` ${missing} unresolved ${missing === 1 ? 'dependency' : 'dependencies'}.` : '';
            const connectionText = connectionCount === totalConnectionCount
                ? `${connectionCount} ${connectionCount === 1 ? 'connection' : 'connections'}`
                : `${connectionCount} of ${totalConnectionCount} connections shown`;
            const parkedText = dockElements.size
                ? ` · ${dockElements.size} parked ${dockElements.size === 1 ? 'card' : 'cards'}`
                : '';
            status.textContent = `${cards.length} ${cards.length === 1 ? 'card' : 'cards'} in ${laneCount} ${laneCount === 1 ? 'lane' : 'lanes'} · ${connectionText}${parkedText}.${missingText}`;
        }

        async function loadBoard() {
            status.classList.remove('error');
            status.textContent = 'Loading board…';
            try {
                const response = await fetch(apiPath('dag'), { cache: 'no-store' });
                if (!response.ok) throw new Error(`The server returned ${response.status}`);
                renderBoard(await response.json());
            } catch (error) {
                status.classList.add('error');
                status.textContent = `Could not load the board: ${error.message}`;
            }
        }

        document.getElementById('refresh').addEventListener('click', loadBoard);
        document.getElementById('toggle-connections').addEventListener('click', event => {
            connectionsVisible = !connectionsVisible;
            connections.hidden = !connectionsVisible;
            event.currentTarget.setAttribute('aria-pressed', String(connectionsVisible));
            event.currentTarget.textContent = connectionsVisible ? 'Hide Dependencies' : 'Show Dependencies';
        });
        document.getElementById('modal-close').addEventListener('click', () => cardModal.close());
        cardModal.addEventListener('click', event => {
            if (event.target === cardModal) cardModal.close();
        });
        new ResizeObserver(scheduleConnections).observe(board);
        window.addEventListener('resize', scheduleConnections);
        loadBoard();
    </script>
</body>
</html>
